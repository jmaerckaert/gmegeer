entity.failover_log.collection:
  path: '/admin/content/failover-logs'
  defaults:
    _entity_list: 'failover_log'
    _title: 'Failover Logs'
  requirements:
    _permission: 'access failover log overview'
entity.failover_log.edit_form:
  path: '/failover-log/{failover_log}/edit'
  defaults:
    _form: '\Drupal\some_module\SomeForm'
  requirements:
    _permission: 'administer failover logs'
